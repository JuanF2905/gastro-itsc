<!-- AJUSTES (Interruptores en la Nube) -->
            <section id="view-ajustes" class="hidden space-y-6">
                <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6">
                    <h4 class="text-brand font-bold text-sm mb-5"><i class="fa-solid fa-server mr-2"></i> Control Global de la Plataforma</h4>
                    <p class="text-xs text-zinc-500 mb-6">Apaga o enciende secciones. Estos cambios se guardan en el servidor y afectan instantáneamente a todos los dispositivos.</p>
                    
                    <div class="space-y-4 max-w-md">
                        <!-- Interruptor 1: Foro -->
                        <div class="flex items-center justify-between p-4 bg-zinc-950 border border-zinc-800 rounded-xl">
                            <div><p class="font-bold text-white text-sm">Módulo de Foro y Chat</p></div>
                            <input type="checkbox" id="toggle-foro" onchange="saveAppModules()" class="w-5 h-5 cursor-pointer accent-brand"/>
                        </div>
                        
                        <!-- Interruptor 2: Videoteca -->
                        <div class="flex items-center justify-between p-4 bg-zinc-950 border border-zinc-800 rounded-xl">
                            <div><p class="font-bold text-white text-sm">Módulo de Videoteca</p></div>
                            <input type="checkbox" id="toggle-videos" onchange="saveAppModules()" class="w-5 h-5 cursor-pointer accent-brand"/>
                        </div>

                        <!-- Interruptor 3: Cursos -->
                        <div class="flex items-center justify-between p-4 bg-zinc-950 border border-zinc-800 rounded-xl">
                            <div><p class="font-bold text-white text-sm">Módulo de Academia</p></div>
                            <input type="checkbox" id="toggle-cursos" onchange="saveAppModules()" class="w-5 h-5 cursor-pointer accent-brand"/>
                        </div>

                        <!-- Interruptor 4: NUEVO - REGISTRO -->
                        <div class="flex items-center justify-between p-4 bg-red-950/20 border border-red-900/30 rounded-xl">
                            <div><p class="font-bold text-white text-sm">Permitir Nuevos Registros</p><p class="text-[10px] text-zinc-500">Si lo apagas, nadie podrá crear cuentas nuevas.</p></div>
                            <input type="checkbox" id="toggle-registro" onchange="saveAppModules()" class="w-5 h-5 cursor-pointer accent-red-500"/>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        const BACKEND_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'http://127.0.0.1:3000' : 'https://gastro-backend-3tgk.onrender.com';
        let adminToken = '';

        function navAdmin(viewId) {
            ['dashboard', 'usuarios', 'recetas', 'videos', 'ajustes'].forEach(v => {
                document.getElementById(`view-${v}`)?.classList.add('hidden');
                document.getElementById(`nav-${v}`)?.classList.replace('bg-brand', 'text-zinc-400');
                document.getElementById(`nav-${v}`)?.classList.replace('text-zinc-950', 'hover:text-white');
            });
            document.getElementById(`view-${viewId}`)?.classList.remove('hidden');
            document.getElementById(`nav-${viewId}`)?.classList.replace('text-zinc-400', 'bg-brand');
            document.getElementById(`nav-${viewId}`)?.classList.replace('hover:text-white', 'text-zinc-950');
            
            if(viewId === 'usuarios') loadAdminUsers();
        }

        document.getElementById('admin-login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            if(document.getElementById('admin-key').value === 'admin123') {
                document.getElementById('admin-login-modal').classList.add('hidden');
                adminToken = 'simulated_token_123';
                loadAppModules(); // Descarga la configuración de Render
            } else { alert("Clave incorrecta."); }
        });

        // ===============================================
        // CONEXIÓN DE MÓDULOS CON LA NUBE (RENDER)
        // ===============================================
        async function loadAppModules() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/settings`);
                const config = await res.json();
                
                // Actualiza los botones visualmente según la base de datos (1 es true, 0 es false)
                document.getElementById('toggle-foro').checked = config.foro === 1;
                document.getElementById('toggle-videos').checked = config.videos === 1;
                document.getElementById('toggle-cursos').checked = config.cursos === 1;
                document.getElementById('toggle-registro').checked = config.registro === 1;
            } catch(e) { console.log("Error cargando módulos"); }
        }

        async function saveAppModules() {
            const config = {
                foro: document.getElementById('toggle-foro').checked,
                videos: document.getElementById('toggle-videos').checked,
                cursos: document.getElementById('toggle-cursos').checked,
                registro: document.getElementById('toggle-registro').checked
            };
            
            try {
                const res = await fetch(`${BACKEND_URL}/api/settings`, {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${adminToken}`
                    },
                    body: JSON.stringify(config)
                });
                if(!res.ok) throw new Error("Fallo");
                // Mostrar pequeña notificación de guardado
                const btn = document.getElementById('header-title');
                const old = btn.innerHTML;
                btn.innerHTML = `<span class="text-emerald-400"><i class="fa-solid fa-cloud-arrow-up"></i> Guardado en la Nube</span>`;
                setTimeout(() => btn.innerHTML = old, 2000);
            } catch (error) { alert("Error al guardar en el servidor"); }
        }

        async function loadAdminUsers() { /* ... Tu código de usuarios igual que antes ... */ }
        async function deleteUser(username) { /* ... Tu código de eliminar igual que antes ... */ }
    </script>
